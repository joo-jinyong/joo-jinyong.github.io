<style type="text/css">
    *,
    *::after,
    *::before {
        box-sizing: border-box;
    }

    :root {
        font-size: 18px;

        --font-sans: Inter-ad2eef0277559c4e,"Inter-ad2eef0277559c4e fallback: Arial",sans-serif;
    }

    .demo-15 {
        --grid-item-ratio: 0.8;
        --grid-item-radius: 0px;
        --grid-gap: 1.5vw;
        --grid-columns: 4;
        --grid-max-width: 1000px;
    }

    body {
        margin: 0;
        color: var(--color-text);
        background-color: var(--color-bg);
        /* font-family: "marlide-display-variable", sans-serif; */
        font-family: var(--font-sans);
        font-variation-settings: "wght" 300;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;

    /* Lenis' recommended styles (lenis/dist/lenis.css) */
    html.lenis,
    html.lenis body {
        height: auto;
    }

    .lenis:not(.lenis-autoToggle).lenis-stopped {
        overflow: clip;
    }

    .lenis [data-lenis-prevent],
    .lenis [data-lenis-prevent-wheel],
    .lenis [data-lenis-prevent-touch],
    .lenis [data-lenis-prevent-vertical],
    .lenis [data-lenis-prevent-horizontal] {
        overscroll-behavior: contain;
    }

    .lenis.lenis-smooth iframe {
        pointer-events: none;
    }

    .lenis.lenis-autoToggle {
        transition-property: overflow;
        transition-duration: 1ms;
        transition-behavior: allow-discrete;
    }

    main {
        display: grid;
        place-items: center;
        width: 100%;
        position: relative;
        /* Cut off the images the effects move past the sides, so phones can't scroll sideways */
        overflow-x: clip;
    }

    .outro {
        display: grid;
        place-items: center;
        margin: 40vh 0;
    }

    .outro__title {
        font-weight: 300;
        font-size: clamp(1.5rem, 10vw, 2rem);
    }

    .card-wrap {
        margin-top: 5vh;
        display: grid;
        gap: 2rem;
        grid-auto-flow: row;
        grid-template-columns: 250px;
        text-align: center;
    }

    .card__image {
        display: block;

        background-position: 50% 50%;
        width: 100%;
        height: auto;
        aspect-ratio: 4 / 3;

    .card__title {

    .credits {

        /* margin: 50vh auto 0;

    }

    /* Page Loader */
    .js .loading::before,
    .js .loading::after {
        content: "";
        position: fixed;
        z-index: 4000;
        inset: -100px;
        background: var(--color-bg); 
    }

    .js .loading::before {
        inset: 0;
        background: var(--color-bg);
    }

    .js .loading::after {
        top: 50%;
        left: 50%;
        width: 60px;
        height: 60px;
        margin: -30px 0 0 -30px;
        border-radius: 50%;
        opacity: 0.4;
        background: var(--color-link);
        animation: loaderAnim 0.7s linear infinite alternate forwards;
    }

    @keyframes loaderAnim {
        to {
            opacity: 1;
            transform: scale3d(0.5, 0.5, 1);
        }
    }

    a {
        text-decoration: none;

    }

    .frame__links,

    }

        color: var(--color-text-muted);
    }

    .frame__tags a:hover {
        color: var(--color-link);
    }

    /* The label, then the variations six to a row, the rows set close together */
    .frame__demos {
        grid-area: demos;
        display: grid;
        grid-template-columns: auto repeat(6, auto);
        gap: 0 0.85rem;
        line-height: 1.35;
        align-items: baseline;
        /* Keep the rows packed at the top when the frame's row is taller than the nav (next to a tall ad, say) */
        align-content: start;
    }

    .frame__demos-label {
        margin-right: 0.4rem;
    }

    /* Every 7th variation starts a new row under the first number, not under the label */
    .frame__demo:nth-child(6n + 2) {
        grid-column-start: 2;
    }

    .frame__demo {
        color: var(--color-text-muted);
    }

    /* The only bright number is the variation you're on */
    .frame__demo:hover,
    .frame__demo--current {
        color: var(--color-text);
    }

    .columns {
        /* A small gutter on phones, so the images don't touch the screen's edges */
        width: calc(var(--grid-width) - 2rem);
        max-width: var(--grid-max-width);
        position: relative;
        /* Close under the header at the top; room at the bottom for the last rows to play out */
        padding: 10rem 0 20vh;
        display: grid;
        place-items: center;
        grid-template-columns: repeat(var(--grid-columns), 1fr);
        gap: var(--grid-gap);
    }

    .column {
        width: 100%;
        position: relative;
        display: grid;
        gap: var(--grid-gap);
        grid-template-columns: 100%;
        will-change: transform;
    }

    .column__item {
        margin: 0;
        position: relative;
        z-index: 1;
    }

    .column__item-imgwrap {
        width: 100%;
        aspect-ratio: var(--grid-item-ratio);
        height: auto;
        position: relative;
        overflow: hidden;
        border-radius: var(--grid-item-radius);
    }

    .column__item-img {
        position: absolute;
        top: calc(-1 * var(--grid-item-translate));
        left: calc(-1 * var(--grid-item-translate));
        height: calc(100% + var(--grid-item-translate) * 2);
        width: calc(100% + var(--grid-item-translate) * 2);
        background-size: cover;
        background-position: 50% 20%;
        backface-visibility: hidden;
    }

    /* Variations 12 and 14 fill the width, with no gaps: their pictures are one sheet, folded into rows (12)
       or columns (14) */
    .demo-12 .columns,
    .demo-14 .columns {
        width: 100%;
    }

    /* Variations 11–18 draw the pictures with WebGL: the canvas sits over the page, and while it draws,
       the DOM pictures only hold their places */
    .grid-canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
        display: none;
    }

    .is-webgl .grid-canvas {
        display: block;
    }

    .is-webgl .column__item-imgwrap {
        visibility: hidden;
    }

    @media screen and (min-width: 53em) {
        /* The title top left with the links right after it, and the ad's place top right (filled on the live server);
    	   under them, the tags on the left and the variations on the right, their tops in line */
        .frame {
            grid-template-columns: auto 1fr auto;
            grid-template-areas: "title links sponsor" "tags tags demos";
            column-gap: 2.5rem;
            row-gap: 1.5rem;

            justify-self: end;
            max-width: 300px;
            text-align: right;
        }
        .columns {
            width: var(--grid-width);
        }
        .card-wrap {
            grid-template-columns: repeat(2, 300px);
        }
    }

        "gsap": "https://esm.sh/gsap@3.12.5",
        "gsap/ScrollTrigger": "https://esm.sh/gsap@3.12.5/ScrollTrigger",

<script type="module">
import * as THREE from "three/webgpu";
import { Fn, uniform, texture, uv, vec2, vec3, vec4, positionGeometry, cos, sin, min, dot } from "three/tsl";
import gsap from "gsap";
import ScrollTrigger from "gsap/ScrollTrigger";
import Lenis from "lenis";

gsap.registerPlugin(ScrollTrigger);

const preloadImages = (selector = "img") => {
    return Promise.all(gsap.utils.toArray(selector).map((el) => {
        const img = new Image();
        img.src = el.tagName === "IMG" ? el.src : getComputedStyle(el).backgroundImage.slice(5, -2);
        return img.decode().catch(() => {});
    }));
};

let lenis;

const grid = document.querySelector(".columns");
const columns = [...grid.querySelectorAll(".column")];
const items = columns.map((column, pos) => {
    return [...column.querySelectorAll(".column__item")].map((item) => ({
        element: item,
        column: pos,
        wrapper: item.querySelector(".column__item-imgwrap"),
        image: item.querySelector(".column__item-img"),
    }));
});
const mergedItems = items.flat();

const initSmoothScrolling = () => {
    lenis = new Lenis({
        lerp: 0.15,
        smoothWheel: true,
    });

    lenis.on("scroll", () => ScrollTrigger.update());

    const update = (time) => lenis.raf(time * 1000);
    gsap.ticker.add(update);
    gsap.ticker.lagSmoothing(0);

    return () => {
        gsap.ticker.remove(update);
        lenis.destroy();
    };
};

const BEND = 0.25;
const SEGMENTS = 32;
const LIGHT = new THREE.Vector3(0, 0, 1);
const AMBIENT = 0.3;

const cover = Fn(([uv, size, image]) => {
    const ratio = vec2(min(size.x.div(size.y).div(image.x.div(image.y)), 1), min(size.y.div(size.x).div(image.y.div(image.x)), 1));
    return uv.mul(ratio).add(vec2(0.5, 0.8).mul(ratio.oneMinus()));
});

const isSoftware = (renderer) => {
    const { backend } = renderer;
    if (backend.isWebGPUBackend) return backend.device.adapterInfo?.isFallbackAdapter === true;
    const {gl} = backend;
    const info = gl.getExtension("WEBGL_debug_renderer_info");
    const name = gl.getParameter(info ? info.UNMASKED_RENDERER_WEBGL : gl.RENDERER);
    return /swiftshader|llvmpipe|software/i.test(name);
};

const createStage = async () => {
    const renderer = new THREE.WebGPURenderer({alpha: true, antialias: true});
    await renderer.init();
    if (isSoftware(renderer)) {
        renderer.dispose();
        throw new Error("software rendering only");
    }

    renderer.setClearColor(0x000000, 0);
    renderer.domElement.classList.add("grid-canvas");
    document.body.append(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(30, 1, 1, 10000);
    const viewport = uniform(new THREE.Vector2(1, 1));
    const geometry = new THREE.PlaneGeometry(1, 1, 1, SEGMENTS);
    const loader = new THREE.TextureLoader();

    const meshes = await Promise.all(mergedItems.map(async (item) => {
        const map = await loader.loadAsync(getComputedStyle(item.image).backgroundImage.slice(5, -2));
        map.colorSpace = THREE.SRGBColorSpace;
        map.anisotropy = 4;

        const center = uniform(new THREE.Vector2(0, 0));
        const size = uniform(new THREE.Vector2(1, 1));
        const flatY = center.y.add(positionGeometry.y.mul(size.y));
        const below = flatY.negate().max(0);
        const radius = viewport.y.mul(BEND);
        const turn = below.div(radius).min(Math.PI / 2);
        const lit = (normal) =>
            min(
                dot(normal, vec3(LIGHT.x, LIGHT.y, LIGHT.z))
                    .max(0)
                    .mul(1 - AMBIENT)
                    .add(AMBIENT)
                    .div(AMBIENT + (1 - AMBIENT) * LIGHT.z),
                1,
            ).pow(2.2);

        const material = new THREE.MeshBasicNodeMaterial();
        material.positionNode = Fn(() => {
            const x = center.x.add(positionGeometry.x.mul(size.x));
            const y = flatY.max(0).sub(radius.mul(sin(turn)));
            const z = radius.mul(cos(turn).oneMinus()).add(below.sub(radius.mul(Math.PI / 2)).max(0));
            return vec3(x, y, z);
        })();
        material.colorNode = Fn(() => {
            const shade = lit(vec3(0, sin(turn), cos(turn)));
            return vec4(texture(map, cover(uv(), size, vec2(map.image.width, map.image.height))).rgb.mul(shade), 1);
        })();

        const mesh = new THREE.Mesh(geometry, material);
        mesh.frustumCulled = false;
        mesh.userData = {item, center, size};
        scene.add(mesh);
        return mesh;
    }));

    const place = () => {
        const { innerWidth: width, innerHeight: height } = window;
        meshes.forEach((mesh) => {
            const rect = mesh.userData.item.element.getBoundingClientRect();
            mesh.userData.center.value.set(rect.left + rect.width/2 - width/2, height/2 - rect.top - rect.height/2);
            mesh.userData.size.value.set(rect.width, rect.height);
        });
    };

    const resize = () => {
        const { innerWidth: width, innerHeight: height } = window;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(width, height, false);
        camera.aspect = width / height;
        camera.position.z = height / 2 / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
        camera.near = camera.position.z / 10;
        camera.far = camera.position.z * 10;
        camera.updateProjectionMatrix();
        viewport.value.set(width, height);
    };

    let lastScroll = null;
    let needsResize = true;
    const onResize = () => (needsResize = true);
    const render = () => {
        if (needsResize) {
            resize();
            needsResize = false;
            lastScroll = null;
        }
        if (window.scrollY === lastScroll) return;
        lastScroll = window.scrollY;
        place();
        renderer.render(scene, camera);
    };

    const show = () => {
        document.documentElement.classList.add("is-webgl");
        needsResize = true;
        window.addEventListener("resize", onResize);
        gsap.ticker.add(render);
        render();
    };
    const hide = () => {
        gsap.ticker.remove(render);
        window.removeEventListener("resize", onResize);
        document.documentElement.classList.remove("is-webgl");
    };

    renderer.onDeviceLost = (info) => {
        console.warn(`The ${info.api} device was lost, the grid is shown without WebGL.`, info.message);
        hide();
    };

    resize();
    place();
    await renderer.compileAsync(scene, camera);
    return { show, hide };
};

Promise.all([preloadImages(".column__item-img"), document.fonts.ready]).then(async () => {
    const stage = await createStage().catch((error) => {
        console.warn(`The grid is shown without WebGL (${error.message}).`);
        return null;
    });
    gsap.matchMedia().add("(prefers-reduced-motion: no-preference)", () => {
        const stopSmoothScrolling = initSmoothScrolling();
        stage?.show();
        return () => {
            stopSmoothScrolling();
            stage?.hide();
        };
    });
    document.body.classList.remove("loading");
});
</script>
</body>
</html>
